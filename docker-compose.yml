x-app: &app
  image: ${IMAGE}
  env_file: ${ENV_FILE:-.env}
  volumes:
    - app_code:/app
    - app_storage:/app/storage
    - app_data:/data
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}

# Solo el init necesita el PAT (git, composer, npm). El resto de servicios lo
# recibe vacio: no queda en su entorno, ni en phpinfo() ni en docker inspect.
x-runtime: &runtime
  environment:
    GITHUB_PAT: ""
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-needs-init: &needs-init
  depends_on:
    init:
      condition: service_completed_successfully

services:
  init:
    <<: *app
    command: init
    user: "0:0"
    restart: "no"

  app:
    <<: [*app, *needs-init, *runtime]
    command: app
    # FrankenPHP trae file capabilities; con cap_drop ALL hace falta esta.
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  schedule:
    <<: [*app, *needs-init, *runtime]
    command: schedule
    healthcheck:
      test: ["CMD", "pgrep", "-f", "schedule:work"]
      interval: 60s
      timeout: 5s
      retries: 3

  queue:
    <<: [*app, *needs-init, *runtime]
    command: queue
    # SIGTERM deja terminar el job en curso; el default de 10s lo mataria
    # antes del --timeout=90 de QUEUE_OPTS. Sube esto si subes el timeout.
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "pgrep", "-f", "queue:work"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  app_code:
  app_storage:
  app_data:
